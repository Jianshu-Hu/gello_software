/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz
      thread_priority: 98
      cpu_affinity: [4,5]
      lock_memory: true
      
      joint_impedance_controller:
        type: franka_fr3_arm_controllers/JointImpedanceController

      deployment_joint_impedance_controller:
        type: franka_fr3_arm_controllers/DeploymentJointImpedanceController

      fr3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

  franka_robot_state_broadcaster:
    ros__parameters:
      # State publication is best-effort telemetry. A missed realtime-publisher
      # lock must not make the 1 kHz controller manager report a controller error.
      lock_log_error: false
      lock_update_success: true

/**:
  joint_impedance_controller:
    ros__parameters:
      k_alpha: 0.99
      command_topic: gello/raw_joint_states
      accepted_target_topic: gello/accepted_joint_states
      activation_mode: always
      command_timeout_sec: 0.5
      k_gains:
        - 240.0
        - 240.0
        - 240.0
        - 240.0
        - 100.0
        - 60.0
        - 20.0
      d_gains:
        - 20.0
        - 20.0
        - 20.0
        - 10.0
        - 10.0
        - 10.0
        - 5.0

/**:
  deployment_joint_impedance_controller:
    ros__parameters:
      k_alpha: 0.99
      command_timeout_sec: 0.5
      command_topic: deployment/joint_states
      accepted_target_topic: deployment/accepted_joint_states
      activation_mode: service
      k_gains:
        - 240.0
        - 240.0
        - 240.0
        - 240.0
        - 100.0
        - 60.0
        - 20.0
      d_gains:
        - 20.0
        - 20.0
        - 20.0
        - 10.0
        - 10.0
        - 10.0
        - 5.0
