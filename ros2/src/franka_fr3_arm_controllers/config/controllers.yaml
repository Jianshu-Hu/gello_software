/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz
      thread_priority: 98
      cpu_affinity: [4,5]
      lock_memory: true
      
      joint_impedance_controller:
        type: franka_fr3_arm_controllers/JointImpedanceController

      deployment_joint_impedance_controller:
        type: franka_fr3_arm_controllers/DeploymentJointImpedanceController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

/**:
  joint_impedance_controller:
    ros__parameters:
      k_alpha: 0.99
      safe_mode: off
      safe_position_margin_rad: 0.02
      safe_max_velocity_rad_s: [2.096, 2.096, 2.096, 2.096, 4.208, 3.344, 4.208]
      safe_max_acceleration_rad_s2: [8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0]
      safe_max_tracking_error_rad: [0.12, 0.12, 0.12, 0.12, 0.20, 0.25, 0.30]
      safe_diagnostic_publish_rate_hz: 25.0
      k_gains:
        - 240.0
        - 240.0
        - 240.0
        - 240.0
        - 100.0
        - 60.0
        - 20.0
      d_gains:
        - 20.0
        - 20.0
        - 20.0
        - 10.0
        - 10.0
        - 10.0
        - 5.0

/**:
  deployment_joint_impedance_controller:
    ros__parameters:
      k_alpha: 0.99
      command_timeout_sec: 0.5
      k_gains:
        - 240.0
        - 240.0
        - 240.0
        - 240.0
        - 100.0
        - 60.0
        - 20.0
      d_gains:
        - 20.0
        - 20.0
        - 20.0
        - 10.0
        - 10.0
        - 10.0
        - 5.0
