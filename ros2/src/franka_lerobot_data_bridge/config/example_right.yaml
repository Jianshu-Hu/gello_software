lerobot_data_bridge:
  ros__parameters:
    sample_rate_hz: 15.0
    max_data_age_sec: 0.5
    publish_host: "127.0.0.1"
    publish_port: 5555
    task_name: "franka_gello_right_arm_teleop"
    include_gripper: true
    include_hand: false
    hand_telemetry_host: "0.0.0.0"
    hand_telemetry_port: 5558
    include_right_arm: false
    arm_mode: "right"
    arm_action_source: "topic"

    right_robot_joint_state_topic: "/right/joint_states"
    right_arm_action_topic: "/right/gello/accepted_joint_states"
    right_robot_gripper_state_topic: "/right/franka_gripper/joint_states"
    right_gripper_action_topic: "/right/gripper/gripper_client/target_gripper_width_percent"

    camera_1_enabled: false
    camera_1_name: "cam_left"
    camera_1_topic: "/cameras/cam_left/image_raw"
    camera_2_enabled: true
    camera_2_name: "cam_front"
    camera_2_topic: "/cameras/cam_front/image_raw"
    camera_3_enabled: true
    camera_3_name: "cam_right"
    camera_3_topic: "/cameras/cam_right/image_raw"
